variables:
  PackageVersion: '2.0.2'

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - src/*
      - .devops/ci.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src
      - .devops/ci.yml

name: "Cake-Tolgee-CI-$(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)"

pool:
  vmImage: windows-latest

stages:
- stage: build
  displayName: 'Build solution'
  jobs:
    - job: build
      steps:
        - checkout: self
          fetchDepth: 5

        - task: UseDotNet@2
          displayName: 'Install .NET 10 SDK'
          inputs:
            packageType: sdk
            version: '10.x'

        - task: DotNetCoreCLI@2
          inputs:
            command: build
            projects: 'cake-tolgee.sln'
            arguments: '-p:Configuration=Release'

        - task: DotNetCoreCLI@2
          inputs:
            command: 'custom'
            projects: 'src/Cake.Storm.Tolgee/Cake.Storm.Tolgee.csproj'
            custom: 'msbuild'
            arguments: '-p:Configuration=Release -p:PackageVersion=$(PackageVersion) -p:PackageOutputPath="$(build.artifactstagingdirectory)" -t:Pack'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Artifact: drop'
          inputs:
            targetPath: $(build.ArtifactStagingDirectory)
            artifact: 'drop'
            publishLocation: 'pipeline'

- stage: deploy_baget
  displayName: 'Deploy to Baget'
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    - group: nuget and baget
  jobs:
    - job: deploy_baget
      steps:
        - checkout: none

        - download: current
          displayName: "Download build artifacts"
          artifact: drop

        # Stay relative: on Windows, a wildcard path containing / fails with "file does not exist".
        - pwsh: dotnet nuget push *.nupkg --source https://nuget.magicbot.fr/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
          displayName: 'NuGet push'
          workingDirectory: $(Pipeline.Workspace)/drop
          env:
            NUGET_API_KEY: $(BagetApiKey)

- stage: deploy_nuget
  displayName: 'Deploy to NuGet'
  dependsOn: deploy_baget
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    - group: nuget and baget
  jobs:
    - deployment: deploy_nuget
      displayName: 'Deploy to NuGet'
      environment: 'Nuget'
      strategy:
        runOnce:
          deploy:
            steps:
              - pwsh: dotnet nuget push *.nupkg --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate
                displayName: 'NuGet push'
                workingDirectory: $(Pipeline.Workspace)/drop
                env:
                  NUGET_API_KEY: $(NuGetApiKey)
