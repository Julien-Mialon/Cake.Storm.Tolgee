variables:
  PackageVersion: '2.0.1'

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - src/*
      - .devops/ci.yml

name: "Cake-Tolgee-CI-$(SourceBranchName)-$(Date:yyyyMMdd)$(Rev:.r)"

pool:
  vmImage: windows-latest

stages:
- stage: build
  displayName: 'Build solution'
  jobs:
    - job: build
      steps:
        - checkout: self
          fetchDepth: 5

        - task: UseDotNet@2
          displayName: 'Install .NET 10 SDK'
          inputs:
            packageType: sdk
            version: '10.x'

        - task: DotNetCoreCLI@2
          inputs:
            command: build
            projects: 'cake-tolgee.sln'
            arguments: '-p:Configuration=Release'

        - task: DotNetCoreCLI@2
          inputs:
            command: 'custom'
            projects: 'src/Cake.Storm.Tolgee/Cake.Storm.Tolgee.csproj'
            custom: 'msbuild'
            arguments: '-p:Configuration=Release -p:PackageVersion=$(PackageVersion) -p:PackageOutputPath="$(build.artifactstagingdirectory)" -t:Pack'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish Artifact: drop'
          inputs:
            targetPath: $(build.ArtifactStagingDirectory)
            artifact: 'drop'
            publishLocation: 'pipeline'

- stage: deploy_baget
  displayName: 'Deploy to Baget'
  dependsOn: build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - job: deploy_baget
      steps:
        - checkout: none

        - download: current
          displayName: "Download build artifacts"
          artifact: drop

        - task: NuGetCommand@2
          displayName: 'NuGet push'
          inputs:
            command: push
            packagesToPush: '$(Pipeline.Workspace)/drop/*.nupkg;!$(Pipeline.Workspace)/drop/*.symbols.nupkg'
            nuGetFeedType: external
            publishFeedCredentials: nuget.internal

- stage: deploy_nuget
  displayName: 'Deploy to NuGet'
  dependsOn: deploy_baget
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - deployment: deploy_nuget
      displayName: 'Deploy to NuGet'
      environment: 'Nuget'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: NuGetCommand@2
                displayName: 'NuGet push'
                inputs:
                  command: push
                  packagesToPush: '$(Pipeline.Workspace)/drop/*.nupkg;!$(Pipeline.Workspace)/drop/*.symbols.nupkg'
                  nuGetFeedType: external
                  publishFeedCredentials: nuget.org
